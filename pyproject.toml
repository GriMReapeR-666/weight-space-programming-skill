[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-space-programming-skill"
version = "0.1.0"
description = "Weight Space Programming skill bundle"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "User", email = "user@example.com"}]
keywords = ["antigravity", "skill", "weight-space"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# add optional deps here

[project.scripts]
wsp = "weight_space_programming_skill.cli:main"
wsp-mcp = "weight_space_programming_skill.engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped", "import-not-found"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "wsp_protocol/tools"]
